<!--
WEBFLOW SETUP (Designer)
Pills:      Div Block, class "cf-chip", custom attribute data-topic = "booking" | "feedback" | "partner" | "other".
            Style hover + the combo class "is-active" in the Designer. Wrap them in a Div "cf-chips".
Topic:      one Webflow Text Field, name "topic", set to Hidden in Field settings (or a Div hidden via display:none).
Rating row: Div "cf-rating" (set display:none in Designer). Inside: five Divs "cf-dot" + Div "cf-rating-label".
            Style combo class "is-filled" on cf-dot in the Designer.
Rating:     one hidden Text Field, name "rating".
Message:    the Textarea gets class "cf-textarea".
Put this Embed anywhere on the page (or Page Settings > Before </body>). Scripts only run on the published/staging site, not in the Designer.
-->
<style>
/* Fallback state styles — delete if you style is-active / is-filled / is-on in the Designer */
.cf-chip.is-active { background: #ECE3DA; border-color: #855632; color: #000; }
.cf-dot.is-filled { background: #855632; }
.cf-rating.is-on { display: flex; }
</style>
<script>
(function () {
  var HINTS = {
    booking:  "Dates you have in mind, how many people, what you're shooting…",
    feedback: "What worked, what didn't, what you'd change about the room…",
    partner:  "Who you are, what you're thinking, and how the studio fits…",
    other:    "Anything at all. We read every note ourselves."
  };
  var LABELS = ["", "Rough start", "Not quite", "Fine", "Good", "Loved it"];

  function closestForm(el) { return el.closest('form') || document; }
  function q(root, sel) { return root.querySelector(sel); }

  function setTopic(chip) {
    var root = closestForm(chip);
    var topic = chip.getAttribute('data-topic') || chip.textContent.trim().toLowerCase();
    root.querySelectorAll('.cf-chip').forEach(function (c) { c.classList.toggle('is-active', c === chip); });
    var field = q(root, 'input[name="topic"], [data-name="topic"]');
    if (field) field.value = topic;
    var msg = q(root, '.cf-textarea, textarea');
    if (msg && HINTS[topic]) msg.placeholder = HINTS[topic];
    var rating = q(root, '.cf-rating');
    if (rating) {
      var on = topic === 'feedback';
      rating.classList.toggle('is-on', on);
      rating.style.display = on ? 'flex' : 'none';
      if (!on) setRating(root, 0);
    }
  }

  function setRating(root, n) {
    root.querySelectorAll('.cf-dot').forEach(function (d, i) { d.classList.toggle('is-filled', i < n); });
    var field = q(root, 'input[name="rating"], [data-name="rating"]');
    if (field) field.value = n || '';
    var label = q(root, '.cf-rating-label');
    if (label) label.textContent = LABELS[n] || '';
  }

  function init() {
    document.addEventListener('click', function (e) {
      var chip = e.target.closest('.cf-chip');
      if (chip) { e.preventDefault(); setTopic(chip); return; }
      var dot = e.target.closest('.cf-dot');
      if (dot) {
        e.preventDefault();
        var dots = Array.prototype.slice.call(closestForm(dot).querySelectorAll('.cf-dot'));
        setRating(closestForm(dot), dots.indexOf(dot) + 1);
      }
    });
    // Default state: first chip (or the one already marked is-active)
    document.querySelectorAll('form, .cf-stack').forEach(function (root) {
      var first = q(root, '.cf-chip.is-active') || q(root, '.cf-chip');
      if (first) setTopic(first);
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>
